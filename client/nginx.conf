server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve files directly, fallback to index.html for client-side routing (SPA)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: add headers for security / caching
  location ~* \.(?:css|js|json|xml|txt|ttf|woff|woff2|eot|otf|svg|ico|png|jpg|jpeg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
